name: CI
on:
  push:
    paths-ignore: ['**/*.md', 'LICENSE']
  pull_request:
    paths-ignore: ['**/*.md', 'LICENSE']
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          cache: pip
      - run: python -m pip install -c requirements-lock.txt -e ".[dev]"
      - run: python -m ruff check .
      - run: python tests/check_contract.py
      - run: python tests/check_upgrade.py
      - run: python -m pip check
      - run: python -m pip install pip-audit==2.10.1
      - run: pip-audit --disable-pip --no-deps --strict -r requirements-lock.txt
      - run: python -m pytest --cov=app --cov-report=term-missing
